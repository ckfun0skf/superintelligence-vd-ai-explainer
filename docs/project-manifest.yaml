project:
  title: "From Prompt to Action: How AI Turns Words into Work"
  purpose: "An audio-synchronized 16:9 explainer that follows an AI request through tokenization, context, attention, next-token generation, tool access, model training, and output consistency."
  repository_or_workspace: "https://github.com/ckfun0skf/superintelligence-vd-ai-explainer"
  delivery_choices:
    source: "existing GitHub repository, main branch"
    preview: "GitHub Pages published from GitHub Actions"
    final_video: "not rendered yet"

video:
  duration_seconds: 466.726
  audio_file_duration_seconds: 466.808
  fps: 24
  width: 1920
  height: 1080
  responsive_scaling: "Single 1920x1080 master composition at every viewport: the 16:9 film stage scales proportionally, with shared stage-relative typography and no phone-specific font or in-frame reflow. Browser text inflation is fixed at 100%. Only the external player shell adapts. Fullscreen preview fits the same 16:9 frame to the available screen and requests landscape orientation where supported. Review captions and controls remain outside the film frame (controls overlay in fullscreen)."
  frame_range: "[0, 11201)"
  narration_or_master_audio: "public/audio/section-01-08-preview-mix.mp3"
  audio_codec: "MP3 review mix; final master format TBD"
  audio_sample_rate_hz: 44100
  audio_channels: 2
  audio_bitrate_kbps: 192

