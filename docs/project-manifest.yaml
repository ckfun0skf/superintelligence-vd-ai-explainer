      - "00:29.9–00:34.5 tokenizer breaks text into tokens"
      - "00:34.5–00:44.0 whole-word, word-piece and punctuation examples; boundaries vary"
      - "00:44.0–00:48.9 tokens map to illustrative numeric IDs"
      - "00:48.9–00:55.6 tokens are building blocks, not complete ideas"
    visual_intent: "Reuse the same submitted prompt node as it moves from the chat bubble into a centered zoom; keep the sentence visible as it becomes larger individual word tiles on two spaced rows; move the original tiles on downward-curved paths into WHOLE WORD, WORD PIECES and PUNCTUATION bins; expand illustrative numeric-ID cells directly below selected tiles."
