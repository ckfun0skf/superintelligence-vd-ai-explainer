      - "00:20.0–00:24.4 handoff into the request-processing explanation"
    visual_intent: "Assemble an unbranded assistant interface with a compact composer fixed at the bottom; type and send the prompt into a user bubble; animate an AI loading state; reveal the nature-first Taipei title and two itinerary cards in sequence beside an enlarged route-map card with visible endpoints."
    review_status: "rechecked locally at 14.2s; enlarged map reads as a route preview rather than a thin line, with the same 16:9 chat composition"
  - id: "scene-02"
    start_seconds: 24.4
    end_seconds: 55.6
    module: "src/main.js"
    narration_cues:
      - "00:24.4–00:29.9 language model receives pieces, not one sentence-object"
      - "00:29.9–00:34.5 tokenizer breaks text into tokens"
      - "00:34.5–00:44.0 whole-word, word-piece, and punctuation examples; boundaries vary"
      - "00:44.0–00:48.9 tokens map to illustrative numeric IDs"
      - "00:48.9–00:55.6 tokens are building blocks, not complete ideas"
    visual_intent: "Enlarge the complete submitted-message bubble and preserve its sentence; separate, larger and more widely spaced word copies emerge below it one by one while source words dim; after every copy arrives, fade the bubble; then move selected copies into WHOLE WORD, WORD PIECES, and PUNCTUATION bins, with illustrative numeric-ID cells below selected tokens. Flight motion reparents the same token node and starts from its actual measured copy position, remaining deterministic under reverse and direct seeking."
    review_status: "token row, spacing, bubble fade, flights, and ID keyframes checked locally; same-node identity and zero-offset takeoff verified after flight correction"
  - id: "scene-03"
    start_seconds: 55.6
    end_seconds: 110.0
    module: "src/main.js"
    narration_cues:
      - "00:55.6–00:58.3 the model uses the pieces together"
      - "00:58.3–01:08.4 duration, location, budget, and preference relationships"
      - "01:08.4–01:13.6 context patterns connect the pieces"
      - "01:13.6–01:20.8 Transformer attention weighs relationships"
      - "01:20.8–01:25.7 typo and imperfect-grammar example begins"
      - "01:25.7–01:37.3 surrounding words make ‘quiet place’ a likely reading"
      - "01:37.3–01:44.5 best-fit inference is not mind-reading"
      - "01:44.5–01:49.8 ask when the distinction matters"
    visual_intent: "Fade the category rack while the original two token rows reappear; draw animated curves from the words into four concept cards for duration, location, budget, and preference; bring in a CONTEXT core, relabel it ATTENTION, and move a focus frame across the relationship cards; transition to a separate typo example, highlight ‘quite’, reveal surrounding context and likely ‘quiet place’ versus an uncertain alternative, then transition into an assistant clarification card with selectable-looking answers when the distinction matters. Fade the whole scene as the fourth chapter enters."
    review_status: "rechecked locally at 103.8s and 105.6s; likely/uncertain outcomes and the enlarged assistant clarification card appear in sequence and remain inside the 16:9 stage"
  - id: "scene-04"
    start_seconds: 110.0
    end_seconds: 177.38
    module: "src/main.js"
    narration_cues:
      - "01:50–02:01.4 an LLM is a trained neural network that recognizes patterns in token sequences"
      - "02:01.4–02:06.1 a response is generally predicted one token at a time"
      - "02:06.1–02:10.3 plausible next-token options are calculated"
      - "02:10.3–02:15.5 a decoding choice is appended to the growing sequence"
      - "02:15.5–02:22.9 each next prediction uses the original prompt plus generated text so far"
      - "02:22.9–02:29.3 repeated passes grow a sentence or longer answer"
      - "02:29.3–02:38.4 caching can reuse earlier computation while context grows"
      - "02:38.4–02:43.5 the model is not simply retrieving one perfect stored answer"
      - "02:43.5–02:48.8 generation draws on learned patterns and supplied context"
      - "02:48.8–02:57.2 current facts and interacting with services require more than the LLM alone"
    visual_intent: "Let the attention/typo scene fade into a visibly layered neural network labeled 'LLM = NEURAL NETWORK'. Send moving signal pulses across four neuron columns. Connect the network to candidate next tokens, fade the candidate-to-response curve with the candidate panel, append chosen tokens to the response, and reconnect the original prompt with the growing output. Move the cache to a clear right-side lane after the candidate panel exits. Before the 02:39 narration beat, temporarily clear response/context cards and show one explicit 'SAVED ANSWER' card, horizontally aligned to the right of the network; strike it through and dissolve it as the neural pattern cloud becomes visible, then restore the generated response and updated context. Finish with distinct live map and weekend-calendar app windows outside the model boundary; draw the route and select dates as the narration names current services. No title card or review subtitles inside the frame."
    review_status: "local Chromium checked at 171.2s; live map/calendar are recognizable app windows, the route and weekend selection are visible, the response card stays separate, and neither app overflows its frame"
  - id: "scene-05"
    start_seconds: 177.38
    end_seconds: 227.866
    module: "src/main.js"
    narration_cues:
      - "02:57.38–02:58.88 chapter pause over the continuing score"
      - "02:58.88–03:03.90 current transit times/opening-hour information may be needed"
      - "03:03.90–03:11.60 the product can provide separate tools where the model lacks reliable live information"
      - "03:11.60–03:20.04 a tool is separate software: map, search, calendar, or booking"
      - "03:20.04–03:31.60 product builders define availability, function, required inputs, and returned results"
      - "03:31.60–03:34.48 permissions can be configured"
      - "03:34.48–03:40.08 a booking action can pause pending user approval"
      - "03:40.08–03:47.56 the model may choose only from application-exposed tools"
    visual_intent: "Start with an AI model and bus/clock live-data need icons; delay the model-to-product connector until the application appears. A builder badge assembles an AI-product capability boundary. Four icon-led map/search/calendar/booking cards animate into the catalog and connect to distinct external route, web, date, and reservation software icons. Highlight the map tool and reveal DOES / NEEDS / RETURNS values as its interface contract. Highlight booking and pause a reservation action at an amber human-approval gate; it is never depicted as approved. Finally, show an imagined ANY TOOL outside the application being stopped by a lock at the boundary. All text stays in-film as functional interface labels; English review captions remain outside."
    review_status: "narration generated at 49.04s with approved voice style; icon-led scene and ANY TOOL denied connector share one fade curve; local/live desktop and mobile preview checked using one 16:9 master; fullscreen, audio seek, and boundary timings tested"
  - id: "scene-06"
    start_seconds: 227.866
    end_seconds: 305.206
    module: "src/main.js"
    narration_cues:
      - "227.866–229.366 music-led chapter pause"
      - "229.366–239.606 available-tool descriptions matched to the current-transit task"
      - "239.606–255.946 map-tool fit, training examples, and product instructions"
      - "255.946–264.306 model emits a structured route request with origin and destination"
      - "264.306–274.686 the application/orchestrator checks and executes the request; separate map software returns a result"
      - "274.686–287.826 the result enters conversation context and the model continues generating"
      - "287.826–304.966 tool selection may fail, results can be incomplete, and consequential actions may require confirmation and permission"
    visual_intent: "Carry the current-transit need into a four-card available-tools catalogue and animate a match signal to MAP. Pair descriptions/expected inputs with a product-instructions and training-example cue. The model sends a structured Taipei Main→Yangmingshan route request to an AI-application/orchestrator card; origin and destination checks animate before an execution pulse crosses to a separate MAP SERVICE card, where a mini-map draws the route as the tool loads. A result card with route options/ETA travels into the conversation as a new context message, then the model resumes a short in-frame response. Finish with tool-error and booking-permission cautions; do not depict a consequential action as approved. No in-frame titles or review subtitles."
    review_status: "Section 06 narration and local Chromium QA passed; full-film pass adds a route-drawing map-service interface. At 273s the line is mid-draw; by 281s the map/result cards remain separate and non-overlapping."
  - id: "scene-07"
    start_seconds: 305.206
    end_seconds: 372.026
    module: "src/main.js"
    narration_cues:
      - "305.206–306.706 music-led chapter handoff"
      - "306.706–317.206 pre-training learns patterns from large collections of text"
      - "317.206–321.906 next-token prediction continues the Taipei nature-weekend example: ‘My budget is…’ → guessed ‘five’"
      - "321.906–333.306 target ‘eight’ mismatches the guess; the model's parameters are adjusted"
      - "333.306–343.206 repeated updates become more likely patterns, not an answer database"
      - "343.206–357.406 instruction, preference, and map-tool tuning examples appear in sequence"
      - "357.406–371.706 methods vary; a Taipei response and sequential model-limit cautions close the section"
    visual_intent: "Keep the Taipei nature-weekend/$8,000 context consistent. A compact training-text card feeds the layered model; the right-side prediction card shows ‘My budget is…’, candidate ‘five’, target ‘eight’, and a mismatch on an illustrative $0–$10K scale. Animate orange directional feedback toward adjustable parameters and back to the model while the guess/target bars converge and the comparison glyph changes from ≠ to ✓. Later use recognizable instruction, thumbs-up/down preference, and map-tool route examples one at a time through a shared slot. Finish with sequential misunderstanding, invented-detail, and wrong-tool cautions. Drive all motion from audio time; keep review captions outside the 16:9 frame."
    review_status: "local Chromium checked at 327.5s (five/eight mismatch) and 330.8s (corrected match); the scale, bars, icon change, parameters and feedback remain within the stage without card collisions"
  - id: "scene-08"
    start_seconds: 372.026
    end_seconds: 466.726
    module: "src/main.js"
    narration_cues:
      - "372.026–373.526 music-led chapter handoff"
      - "373.526–394.826 same prompt, next-token candidates, and decoding choices"
      - "394.826–411.626 sampling and variation can produce plausible branch differences"
      - "411.626–425.226 instructions, chat history, tools, model versions, and the full-context distinction"
      - "425.226–433.126 inconsistent outputs are harder to reproduce, compare, and trust"
      - "433.126–447.806 lower variation can help, but consistency is not accuracy; check and verify"
      - "447.806–466.726 reflective outro: what to verify before acting; judgment and responsibility remain with people"
    visual_intent: "Keep the Taipei nature-weekend and under-$8,000 visible prompt unchanged. Feed one layered neural model and animate two possible next stops into alternative, constraint-preserving itinerary orders; reveal the Day 01 choice before Day 02 in both branches and draw a distinct miniature route in each answer card. Show an illustrative decoding-variation control, then add recognizable system, chat-history, live-map, and model-update source icons beside the same visible prompt. Replace the red consequence row with three separate, icon-led mini-animations for reproducibility, comparison, and unresolved trust. Clear to consistency-versus-accuracy and verification actions, then fade in a concluding Prompt → Model → Verify → You Decide flow with a live evidence signal, completed check, and open question mark as the reflective narration plays. All transforms, opacity, and signal paths derive from absolute audio time; no title card or review subtitles inside the frame."
    review_status: "pass: larger Section 07/08 typography, three icon-led consequence animations, and the reflective 18.92-second outro verified in local Chromium; 16:9 stage and all cards remain in bounds"

