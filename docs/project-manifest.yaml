    visual_intent: "Enlarge the complete submitted-message bubble near the center and preserve its sentence; create separate word copies below it one by one while dimming each source word; settle copies into two central rows, then move selected copies into WHOLE WORD, WORD PIECES and PUNCTUATION bins; expand illustrative numeric-ID cells below selected tokens."
