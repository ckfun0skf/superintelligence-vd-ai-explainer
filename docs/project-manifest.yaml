project:
  title: "From Prompt to Action: How AI Turns Words into Work"
  purpose: "An audio-synchronized 16:9 explainer that follows a request from an assistant interface through tokenization, context, attention, intent inference, next-token generation, and tool access."
  repository_or_workspace: "https://github.com/ckfun0skf/superintelligence-vd-ai-explainer"
  delivery_choices:
    source: "existing GitHub repository, main branch"
    preview: "GitHub Pages published from GitHub Actions"
    final_video: "not rendered yet"

video:
  duration_seconds: 227.866
  fps: 24
  width: 1920
  height: 1080
  responsive_scaling: "Single 1920x1080 master composition at every viewport: the 16:9 film stage scales proportionally, with no phone-specific typography floors or in-frame reflow. Only the external player shell adapts. Fullscreen preview fits the 16:9 frame to the available screen and requests landscape orientation where supported. Review captions and controls remain outside the film frame (controls overlay in fullscreen)."
  frame_range: "[0, 5469)"
  narration_or_master_audio: "public/audio/section-01-05-preview-mix.mp3"
  audio_codec: "MP3 review mix; final master format TBD"
  audio_sample_rate_hz: 44100
  audio_channels: 2
  audio_bitrate_kbps: 192

scenes:
  - id: "scene-01"
    start_seconds: 0.0
    end_seconds: 24.4
    module: "src/main.js"
    narration_cues:
      - "00:00–00:01.5 music-only assistant interface build"
      - "00:01.5–00:20.0 Taipei prompt, itinerary response, and tool question"
      - "00:20.0–00:24.4 handoff into the request-processing explanation"
    visual_intent: "Assemble an unbranded assistant interface with a compact composer fixed at the bottom; type and send the prompt into a user bubble; animate an AI loading state; reveal the nature-first Taipei title and two itinerary cards in sequence."
    review_status: "previously published; retained in the five-section regression preview"
  - id: "scene-02"
    start_seconds: 24.4
    end_seconds: 55.6
    module: "src/main.js"
    narration_cues:
      - "00:24.4–00:29.9 language model receives pieces, not one sentence-object"
      - "00:29.9–00:34.5 tokenizer breaks text into tokens"
      - "00:34.5–00:44.0 whole-word, word-piece, and punctuation examples; boundaries vary"
      - "00:44.0–00:48.9 tokens map to illustrative numeric IDs"
      - "00:48.9–00:55.6 tokens are building blocks, not complete ideas"
    visual_intent: "Enlarge the complete submitted-message bubble and preserve its sentence; separate, larger and more widely spaced word copies emerge below it one by one while source words dim; after every copy arrives, fade the bubble; then move selected copies into WHOLE WORD, WORD PIECES, and PUNCTUATION bins, with illustrative numeric-ID cells below selected tokens. Flight motion reparents the same token node and starts from its actual measured copy position, remaining deterministic under reverse and direct seeking."
    review_status: "token row, spacing, bubble fade, flights, and ID keyframes checked locally; same-node identity and zero-offset takeoff verified after flight correction"
  - id: "scene-03"
    start_seconds: 55.6
    end_seconds: 110.0
    module: "src/main.js"
    narration_cues:
      - "00:55.6–00:58.3 the model uses the pieces together"
      - "00:58.3–01:08.4 duration, location, budget, and preference relationships"
      - "01:08.4–01:13.6 context patterns connect the pieces"
      - "01:13.6–01:20.8 Transformer attention weighs relationships"
      - "01:20.8–01:25.7 typo and imperfect-grammar example begins"
      - "01:25.7–01:37.3 surrounding words make ‘quiet place’ a likely reading"
      - "01:37.3–01:44.5 best-fit inference is not mind-reading"
      - "01:44.5–01:49.8 ask when the distinction matters"
    visual_intent: "Fade the category rack while the original two token rows reappear; draw animated curves from the words into four concept cards for duration, location, budget, and preference; bring in a CONTEXT core, relabel it ATTENTION, and move a focus frame across the relationship cards; transition to a separate typo example, highlight ‘quite’, reveal surrounding contextual words and a ‘quiet place’ likely-reading card, then add best-fit uncertainty and a clarification cue. Fade the whole scene as the fourth chapter enters."
    review_status: "rechecked locally at 55.6s, 65.5s, 76.5s, 89.0s, 106.2s, and the 110s handoff"
  - id: "scene-04"
    start_seconds: 110.0
    end_seconds: 177.38
    module: "src/main.js"
    narration_cues:
      - "01:50–02:01.4 an LLM is a trained neural network that recognizes patterns in token sequences"
      - "02:01.4–02:06.1 a response is generally predicted one token at a time"
      - "02:06.1–02:10.3 plausible next-token options are calculated"
      - "02:10.3–02:15.5 a decoding choice is appended to the growing sequence"
      - "02:15.5–02:22.9 each next prediction uses the original prompt plus generated text so far"
      - "02:22.9–02:29.3 repeated passes grow a sentence or longer answer"
      - "02:29.3–02:38.4 caching can reuse earlier computation while context grows"
      - "02:38.4–02:43.5 the model is not simply retrieving one perfect stored answer"
      - "02:43.5–02:48.8 generation draws on learned patterns and supplied context"
      - "02:48.8–02:57.2 current facts and interacting with services require more than the LLM alone"
    visual_intent: "Let the attention/typo scene fade into a visibly layered neural network labeled 'LLM = NEURAL NETWORK'. Send moving signal pulses across four neuron columns. Connect the network to candidate next tokens, fade the candidate-to-response curve with the candidate panel, append chosen tokens to the response, and reconnect the original prompt with the growing output. Move the cache to a clear right-side lane after the candidate panel exits. Before the 02:39 narration beat, temporarily clear response/context cards and show one explicit 'SAVED ANSWER' card, horizontally aligned to the right of the network; strike it through and dissolve it as the neural pattern cloud becomes visible, then restore the generated response and updated context. Finish with muted live-map/calendar modules outside the model boundary. No title card or review subtitles inside the frame."
    review_status: "public version checked around 02:11–02:53 after mobile typography refinement; Section 4 prompt, response, context and tool labels are larger while staying inside the 16:9 layout"
  - id: "scene-05"
    start_seconds: 177.38
    end_seconds: 227.866
    module: "src/main.js"
    narration_cues:
      - "02:57.38–02:58.88 chapter pause over the continuing score"
      - "02:58.88–03:03.90 current transit times/opening-hour information may be needed"
      - "03:03.90–03:11.60 the product can provide separate tools where the model lacks reliable live information"
      - "03:11.60–03:20.04 a tool is separate software: map, search, calendar, or booking"
      - "03:20.04–03:31.60 product builders define availability, function, required inputs, and returned results"
      - "03:31.60–03:34.48 permissions can be configured"
      - "03:34.48–03:40.08 a booking action can pause pending user approval"
      - "03:40.08–03:47.56 the model may choose only from application-exposed tools"
    visual_intent: "Start with an AI model and bus/clock live-data need icons; delay the model-to-product connector until the application appears. A builder badge assembles an AI-product capability boundary. Four icon-led map/search/calendar/booking cards animate into the catalog and connect to distinct external route, web, date, and reservation software icons. Highlight the map tool and reveal DOES / NEEDS / RETURNS values as its interface contract. Highlight booking and pause a reservation action at an amber human-approval gate; it is never depicted as approved. Finally, show an imagined ANY TOOL outside the application being stopped by a lock at the boundary. All text stays in-film as functional interface labels; English review captions remain outside."
    review_status: "narration generated at 49.04s with approved voice style; icon-led scene and ANY TOOL denied connector share one fade curve; local/live desktop and mobile preview checked using one 16:9 master; fullscreen, audio seek, and boundary timings tested"

